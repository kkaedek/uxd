    <div class="contact-container">

        <h1>Contact Us</h1>

        <p>Have questions or feedback? We'd love to hear from you.</p>

        <form id="contactForm">

            <label>Name</label>
            <input type="text" id="name" required>
            <span class="error" id="nameError"></span>

            <label>Email</label>
            <input type="email" id="email" required>
            <span class="error" id="emailError"></span>

            <label>Favourite Club</label>
            <select id="club" required>
                <option value="">Select Club</option>
                <option>Barcelona</option>
                <option>Real Madrid</option>
                <option>Liverpool</option>
                <option>Manchester United</option>
                <option>Manchester City</option>
            </select>

            <span class="error" id="clubError"></span>

            <label>Reason</label>

            <select id="reason">
                <option>General Question</option>
                <option>Prediction Feedback</option>
                <option>Club Suggestion</option>
                <option>Other</option>
            </select>

            <label>Message</label>

            <textarea id="message" rows="6" maxlength="300" required></textarea>

            <p id="counter">0 / 300</p>

            <span class="error" id="messageError"></span>

            <label>

                <input type="checkbox" id="newsletter">

                Receive Weekly Football Updates

            </label>

            <button type="submit">

                Send Message

            </button>

        </form>

    </div>

    <script>const form = document.getElementById("contactForm");
        const message = document.getElementById("message");
        const counter = document.getElementById("counter");

        message.addEventListener("input", function () {

            counter.textContent = message.value.length + " / 300";

        });

        form.addEventListener("submit", function (event) {

            event.preventDefault();

            document.getElementById("nameError").textContent = "";
            document.getElementById("emailError").textContent = "";
            document.getElementById("clubError").textContent = "";
            document.getElementById("messageError").textContent = "";

            let valid = true;

            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const club = document.getElementById("club").value;
            const reason = document.getElementById("reason").value;
            const messageText = message.value.trim();
            const newsletter = document.getElementById("newsletter").checked;

            if (name === "") {

                document.getElementById("nameError").textContent =
                    "Please enter your name.";

                valid = false;

            }

            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (!emailPattern.test(email)) {

                document.getElementById("emailError").textContent =
                    "Please enter a valid email.";

                valid = false;

            }

            if (club === "") {

                document.getElementById("clubError").textContent =
                    "Please select a club.";

                valid = false;

            }

            if (messageText.length < 20) {

                document.getElementById("messageError").textContent =
                    "Message must be at least 20 characters.";

                valid = false;

            }

            if (valid) {

                localStorage.setItem("name", name);
                localStorage.setItem("email", email);
                localStorage.setItem("club", club);
                localStorage.setItem("reason", reason);
                localStorage.setItem("message", messageText);
                localStorage.setItem("newsletter", newsletter);

                window.location.href = "response.html";

            }

        });</script>
