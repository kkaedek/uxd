<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Response Submitted | Football Hub</title>
  <link rel="stylesheet" href="textstyle.css">
</head>
<body>

  <section class="response-page">
    <div class="response-box">
      <h1>Response Submitted</h1>
      <p>Your message has been received successfully.</p>
      <p>We will get back to you as soon as possible.</p>

      <div class="prediction-summary">
        <div class="summary-row">
          <span class="summary-label">Name:</span>
          <span id="displayName"></span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Email:</span>
          <span id="displayEmail"></span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Favourite Club:</span>
          <span id="displayClub"></span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Reason:</span>
          <span id="displayReason"></span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Message:</span>
          <span id="displayMessage"></span>
        </div>

        <div class="summary-row">
          <span class="summary-label">Newsletter:</span>
          <span id="displayNewsletter"></span>
        </div>
      </div>

      <div class="response-buttons">
        <a href="contactus.html" class="response-btn secondary">Submit Another Response</a>
        <a href="homepage.html" class="response-btn primary">Back to Homepage</a>
      </div>
    </div>
  </section>

  <script>
    document.getElementById("displayName").textContent =
      localStorage.getItem("name") || "Not provided";

    document.getElementById("displayEmail").textContent =
      localStorage.getItem("email") || "Not provided";

    document.getElementById("displayClub").textContent =
      localStorage.getItem("club") || "Not provided";

    document.getElementById("displayReason").textContent =
      localStorage.getItem("reason") || "Not provided";

    document.getElementById("displayMessage").textContent =
      localStorage.getItem("message") || "Not provided";

    const newsletter = localStorage.getItem("newsletter");
    document.getElementById("displayNewsletter").textContent =
      newsletter === "true" ? "Yes" : "No";
  </script>

</body>
</html>
