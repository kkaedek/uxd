<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Response Submitted | Football Hub</title>

    <link rel="icon" type="image/x-icon"
        href="https://github.com/user-attachments/assets/218f55f4-4a5a-4626-b4f0-00ba42760d43">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="eldrickcss.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>

<body>
        <div class="response-box">

            <h1>Thank You!</h1>

            <p>Your message has been received successfully.</p>
            <p> We will get back to you as soon as possible!</p>

            <hr>

            <p><strong>Name:</strong> <span id="displayName"></span></p>

            <p><strong>Email:</strong> <span id="displayEmail"></span></p>

            <p><strong>Favourite Club:</strong> <span id="displayClub"></span></p>

            <p><strong>Reason:</strong> <span id="displayReason"></span></p>

            <p><strong>Message:</strong></p>

            <p id="displayMessage"></p>

            <p><strong>Newsletter:</strong> <span id="displayNewsletter"></span></p>

            <div class="button-container">

                <a href="homepage.html" class="home-button">

                    Return Home

                </a>

            </div>

        </div>

        <script>document.getElementById("displayName").textContent =
                localStorage.getItem("name");

            document.getElementById("displayEmail").textContent =
                localStorage.getItem("email");

            document.getElementById("displayClub").textContent =
                localStorage.getItem("club");

            document.getElementById("displayReason").textContent =
                localStorage.getItem("reason");

            document.getElementById("displayMessage").textContent =
                localStorage.getItem("message");

            const newsletter = localStorage.getItem("newsletter");

            if (newsletter === "true") {

                document.getElementById("displayNewsletter").textContent = "Yes";

            }
            else {

                document.getElementById("displayNewsletter").textContent = "No";

            }</script>
        <!-- FOOTER -->
        <footer class="footer-bar">
            <p>© 2026 Football Hub</p>
        </footer>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>

        <script>
            const sections = document.querySelectorAll(".club-section");

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add("show");
                    }
                });
            }, {
                threshold: 0.25
            });

            sections.forEach(section => {
                observer.observe(section);
            });
            const cards = document.querySelectorAll(".trophy-card");

            cards.forEach(card => {
                observer.observe(card);
            });
        </script>
    </body>

</html>
